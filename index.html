<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Waypoint — Travel Cost Calculator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1B2A4A;
  --ink-soft:#3B4A6B;
  --paper:#F7F3E9;
  --paper-dim:#EFE9D8;
  --brass:#B8863C;
  --brass-dim:#D9BE8C;
  --stamp:#A8443B;
  --stamp-soft:#F4E3E0;
  --line:#D8CFB8;
  --white:#FFFDF9;
  --ok:#2F6B4F;
}
*{box-sizing:border-box;}
body{margin:0;background:var(--ink);font-family:'IBM Plex Sans',sans-serif;color:var(--ink);}
.app{max-width:1180px;margin:0 auto;background:var(--paper);min-height:100vh;}
h1,h2,h3,h4{font-family:'Fraunces',serif;font-weight:600;margin:0;}
.mono{font-family:'IBM Plex Mono',monospace;}

/* ===== Header ===== */
.header{background:var(--ink);color:var(--paper);padding:28px 32px 22px;position:relative;overflow:hidden;}
.header::after{content:"";position:absolute;right:-40px;top:-40px;width:220px;height:220px;border:1px solid rgba(247,243,233,.12);border-radius:50%;}
.header::before{content:"";position:absolute;right:20px;bottom:-90px;width:220px;height:220px;border:1px solid rgba(247,243,233,.08);border-radius:50%;}
.brandrow{display:flex;align-items:baseline;justify-content:space-between;gap:20px;flex-wrap:wrap;position:relative;z-index:1;}
.brand{display:flex;align-items:baseline;gap:12px;}
.brand h1{font-size:30px;letter-spacing:.3px;}
.brand .tag{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--brass-dim);}
.homebar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;font-size:13px;position:relative;z-index:1;}
.homebar select{background:rgba(247,243,233,.08);border:1px solid rgba(247,243,233,.25);color:var(--paper);padding:7px 10px;border-radius:6px;font-family:'IBM Plex Mono',monospace;font-size:12.5px;}
.homebar label{color:var(--brass-dim);font-family:'IBM Plex Mono',monospace;font-size:11px;text-transform:uppercase;letter-spacing:1px;}

/* ===== Nav ===== */
.tabs{display:flex;background:var(--white);border-bottom:1px solid var(--line);overflow-x:auto;}
.tab{padding:14px 20px;font-family:'IBM Plex Mono',monospace;font-size:12.5px;letter-spacing:.5px;text-transform:uppercase;cursor:pointer;color:var(--ink-soft);border-bottom:3px solid transparent;white-space:nowrap;}
.tab.active{color:var(--ink);border-bottom-color:var(--brass);font-weight:600;}
.tab .n{display:inline-block;background:var(--paper-dim);color:var(--ink-soft);border-radius:10px;padding:1px 7px;font-size:10.5px;margin-left:6px;}

.view{padding:26px 32px 60px;}
.section-title{display:flex;align-items:center;gap:10px;margin-bottom:4px;}
.section-title h2{font-size:22px;}
.section-sub{color:var(--ink-soft);font-size:13.5px;margin-bottom:18px;}

/* ===== Cards ===== */
.card{background:var(--white);border:1px solid var(--line);border-radius:10px;padding:20px;margin-bottom:16px;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;}
@media(max-width:720px){.grid2,.grid3{grid-template-columns:1fr;}}
.field label{display:block;font-family:'IBM Plex Mono',monospace;font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--ink-soft);margin-bottom:6px;}
select,input[type=text],input[type=number],input[type=url],input[type=date]{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:6px;font-size:14px;font-family:'IBM Plex Sans',sans-serif;background:var(--white);color:var(--ink);}
input:focus,select:focus{outline:2px solid var(--brass);outline-offset:1px;}
button{cursor:pointer;font-family:'IBM Plex Sans',sans-serif;}
.btn{background:var(--ink);color:var(--paper);border:none;padding:10px 18px;border-radius:6px;font-size:13.5px;font-weight:600;}
.btn:hover{background:var(--ink-soft);}
.btn.brass{background:var(--brass);color:var(--ink);}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink);}
.btn.stamp{background:var(--stamp);color:var(--white);}
.btn.sm{padding:6px 12px;font-size:12.5px;border-radius:5px;}
.btn:disabled{opacity:.5;cursor:not-allowed;}
.pill{display:inline-block;font-family:'IBM Plex Mono',monospace;font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;padding:3px 9px;border-radius:20px;border:1px solid var(--line);color:var(--ink-soft);}
.pill.official{background:#E7F0EA;color:var(--ok);border-color:#BFDDC9;}
.pill.tourism{background:#E9EFF7;color:#2C4B7C;border-color:#C7D6EC;}
.pill.secondary{background:#FBF1DD;color:#8A6316;border-color:#EAD7A9;}
.pill.stale{background:var(--stamp-soft);color:var(--stamp);border-color:#E4C1BC;}
.pill.manual{background:#F0EAF4;color:#6B3E8C;border-color:#DBC9E6;}

.empty{padding:40px 20px;text-align:center;color:var(--ink-soft);border:1px dashed var(--line);border-radius:10px;background:var(--white);}
.empty h3{font-size:16px;margin-bottom:6px;}

/* country/place chooser */
.chip{display:inline-flex;align-items:center;gap:8px;background:var(--paper-dim);border:1px solid var(--line);border-radius:20px;padding:6px 12px 6px 14px;font-size:13px;margin:3px 6px 3px 0;}
.chip button{background:none;border:none;color:var(--stamp);font-weight:700;padding:0 2px;font-size:14px;}
.searchbox{position:relative;}
.searchresults{position:absolute;top:100%;left:0;right:0;background:var(--white);border:1px solid var(--line);border-top:none;max-height:220px;overflow-y:auto;z-index:20;border-radius:0 0 6px 6px;box-shadow:0 8px 20px rgba(0,0,0,.08);}
.searchresults div{padding:8px 12px;font-size:13.5px;cursor:pointer;}
.searchresults div:hover{background:var(--paper-dim);}

.place-item{border:1px solid var(--line);border-radius:8px;padding:14px;margin-bottom:10px;background:var(--white);}
.place-item .rowtop{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;}
.item-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-top:1px solid var(--paper-dim);font-size:13.5px;}
.item-row:first-of-type{border-top:none;}
.item-meta{color:var(--ink-soft);font-size:12px;margin-top:2px;}
.qty-input{width:56px;padding:5px 6px;font-size:13px;}

.loading-line{display:flex;align-items:center;gap:8px;color:var(--ink-soft);font-size:13px;padding:10px 0;}
.spinner{width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--brass);border-radius:50%;animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}

.warn-banner{background:var(--stamp-soft);border:1px solid #E4C1BC;color:#7A2E27;padding:10px 14px;border-radius:8px;font-size:13px;margin-bottom:14px;}
.note{font-size:12px;color:var(--ink-soft);margin-top:4px;}

/* boarding pass total */
.boardingpass{background:var(--ink);color:var(--paper);border-radius:14px;padding:0;display:flex;overflow:hidden;position:relative;box-shadow:0 12px 30px rgba(27,42,74,.35);}
.bp-main{flex:1;padding:26px 30px;}
.bp-stub{width:200px;background:rgba(247,243,233,.06);padding:26px 22px;border-left:2px dashed rgba(247,243,233,.35);position:relative;}
.bp-main .lbl,.bp-stub .lbl{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--brass-dim);}
.bp-total{font-family:'Fraunces',serif;font-size:44px;font-weight:700;margin-top:6px;}
.bp-range{font-family:'Fraunces',serif;font-size:30px;font-weight:700;margin-top:6px;}
.bp-sub{font-size:12.5px;color:rgba(247,243,233,.7);margin-top:6px;}
.bp-punch{position:absolute;width:22px;height:22px;background:var(--paper);border-radius:50%;left:-13px;}
.bp-punch.top{top:-11px;}
.bp-punch.bot{bottom:-11px;}

.cat-total-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-top:16px;}
.cat-total{background:var(--white);border:1px solid var(--line);border-radius:8px;padding:14px;}
.cat-total .lbl{font-family:'IBM Plex Mono',monospace;font-size:10.5px;text-transform:uppercase;letter-spacing:1px;color:var(--ink-soft);}
.cat-total .amt{font-family:'Fraunces',serif;font-size:20px;margin-top:4px;}

.country-block{margin-bottom:26px;}
.country-head{display:flex;align-items:baseline;gap:10px;border-bottom:2px solid var(--ink);padding-bottom:6px;margin-bottom:10px;}
.country-head h3{font-size:19px;}
.country-head .amt{margin-left:auto;font-family:'IBM Plex Mono',monospace;font-size:15px;}

a.srclink{color:var(--brass);font-weight:600;text-decoration:none;border-bottom:1px solid var(--brass-dim);}
a.srclink:hover{color:var(--ink);}

table.srctable{width:100%;border-collapse:collapse;font-size:13px;}
table.srctable th{text-align:left;font-family:'IBM Plex Mono',monospace;font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--ink-soft);padding:8px 10px;border-bottom:2px solid var(--ink);}
table.srctable td{padding:9px 10px;border-bottom:1px solid var(--paper-dim);vertical-align:top;}
</style>
</head>

  if(el) el['on'+evt] = handler;
  return el;
}

/* ============================= STATE ============================= */
let state = {
  homeCountry: null, // iso2
  homeCurrency: null, // code
  countries: [],     // { iso2, name, currency, places:[...] }
  rateCache: {},      // "FROM_TO" -> {rate,date,sourceName,sourceUrl}
  activeTab: 'trip'
};

function findCountry(iso2){ return state.countries.find(c=>c.iso2===iso2); }

function ensureCountry(iso2){
  let c = findCountry(iso2);
  if(!c){
    const base = COUNTRIES.find(x=>x.iso2===iso2);
    c = {iso2, name: base.name, currency: base.currency, places: []};
    state.countries.push(c);
  }
  return c;
}

/* ============================= AI CALLS ============================= */
// NOTE: fetch() in this sandboxed environment is relayed to the host frame, which cannot
// structured-clone an AbortSignal/AbortController through that channel. So timeouts here are
// implemented with a plain Promise.race + setTimeout instead of AbortController — no signal
// is ever passed into fetch() options, and no non-serializable object crosses any message boundary.
function fetchClaudeRaw(body, timeoutMs){
  const ms = timeoutMs || 25000;
  const fetchPromise = fetch("https://api.anthropic.com/v1/messages", {
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body: JSON.stringify(body)
  }).then(async response=>{
    if(!response.ok){
      let detail = '';
      try{ detail = await response.text(); }catch(e){}
      const err = new Error(`HTTP ${response.status}`);
      err.kind = (response.status>=500 || response.status===429) ? 'network' : 'http';
      err.detail = detail;
      throw err;
    }
    return await response.json();
  }).catch(e=>{
    if(!e.kind) e.kind = 'network'; // fetch threw (CORS, offline, DNS, endpoint unreachable, etc.)
    throw e;
  });
  const timeoutPromise = new Promise((_, reject)=>{
    setTimeout(()=>{
      const te = new Error('Request timed out');
      te.kind = 'network';
      reject(te);
    }, ms);
  });
  return Promise.race([fetchPromise, timeoutPromise]);
}

// Retries once on network-type failures (not on a clean HTTP 4xx or a parse issue) before giving up.
async function callClaude(system, user, maxTok, debugLabel){
  const reqId = uid();
  const body = {
    model: "claude-sonnet-4-6",
    max_tokens: maxTok || 1000,
    system: system,
    messages: [{role:"user", content: user}],
    tools: [{type:"web_search_20250305", name:"web_search"}]
  };
  safeDebug(`[Waypoint search] start`, {requestId:reqId, label:debugLabel||'query', provider:'claude-sonnet-4-6 + web_search'});
  let data;
  try{
    data = await fetchClaudeRaw(body, 25000);
  }catch(firstErr){
    if(firstErr.kind === 'network'){
      safeDebug(`[Waypoint search] retrying after transient failure`, {requestId:reqId, errorType:firstErr.kind});
      await new Promise(r=>setTimeout(r, 800));
      try{
        data = await fetchClaudeRaw(body, 25000);
      }catch(secondErr){
        secondErr.kind = secondErr.kind || 'network';
        secondErr.searchUnavailable = true;
        safeDebug(`[Waypoint search] failed`, {requestId:reqId, errorType:secondErr.kind, message:secondErr.message});
        throw secondErr;
      }
    } else {
      firstErr.searchUnavailable = true;
      safeDebug(`[Waypoint search] failed`, {requestId:reqId, errorType:firstErr.kind, message:firstErr.message});
      throw firstErr;
    }
  }
  const text = (data.content||[]).filter(b=>b.type==="text").map(b=>b.text).join("\n");
  if(!text){
    safeDebug(`[Waypoint search] empty response`, {requestId:reqId});
    const e = new Error('Empty response'); e.kind='parse'; throw e;
  }
  safeDebug(`[Waypoint search] success`, {requestId:reqId, responseLength:text.length});
  return text;
}
function extractJSON(text){
  let t = text.trim().replace(/^```json/i,"").replace(/^```/,"").replace(/```$/,"").trim();
  const first = t.indexOf("{"); const last = t.lastIndexOf("}");
  if(first>=0 && last>first) t = t.slice(first,last+1);
  try{ return JSON.parse(t); }catch(e){ return null; }
}
function friendlySearchError(e){
  // Never surface raw network/CORS/HTTP jargon to the user.
  safeError('Waypoint search error:', e && e.kind, e && e.message, e && e.detail);
  return "Verified search temporarily unavailable";
}

async function aiSearchPlaceOnce(name, type, city, region, island, countryName, currency, extraHint){
  const system = `You are a travel-pricing research assistant. Use web search to find REAL, currently-listed information about the specific place named by the user. You MUST base every price on an actual source you found via search this turn — never estimate or invent a number. A price is only "verified" when the source you found actually states that price for that item — do not turn a general mention of the place into a verified price.
Source policy — the information must be verifiable and traceable to an authoritative source, but it does NOT need to come only from the business's own website. Acceptable sources, in preference order:
(1) "Official" — the place/event/attraction's own official website or verified official ticketing page.
(2) "Officially Sourced" — a reliable source that reproduces or provides information originating from an official source: official tourism authorities/boards, government sources, authorized ticket sellers, recognized event/ticket platforms, or a reputable database that clearly cites official information.
(3) "Verified Secondary" — a reputable source with verifiable information when no official or officially-sourced option exists.
Never use an "Unverified" source in the results.
Respond with ONLY one JSON object, no markdown fences, no commentary, no explanation text outside the JSON.
JSON schema:
{
 "found": boolean (true if you identified this REAL place at all, even if you couldn't verify a price),
 "reason": string (only if found=false — why the place itself couldn't be identified),
 "place": {"name": string, "type": string, "address": string, "island": string|null, "matchedCurrency": ISO4217 code},
 "pricingVerified": boolean (true only if "items" contains at least one real sourced price),
 "sourceQuality": "Official" | "Officially Sourced" | "Verified Secondary" | null,
 "sourceName": string|null,
 "sourceUrl": string|null (direct pricing/menu page if possible),
 "verifiedDate": "${fmtDate(TODAY)}",
 "items": [
   {"name": string, "category": "ticket"|"food"|"drink"|"souvenir"|"activity"|"merchandise"|"other",
    "priceType": "exact"|"range", "price": number|null, "minPrice": number|null, "maxPrice": number|null,
    "currency": ISO4217 code}
 ]
}
If you find the place but no page you can access states real prices, set found:true, pricingVerified:false, items:[]. Include at most 8 of the most relevant priced items when pricing is verified.`;
  const user = `Place name: "${name}"\nPlace type: ${type||"(unspecified — infer from context)"}\nCity/Area: ${city||"(unspecified)"}\nIsland/Area: ${island||"(unspecified)"}\nRegion: ${region||"(unspecified)"}\nCountry: ${countryName}\nExpected local currency: ${currency}\nToday's date: ${fmtDate(TODAY)}${extraHint? "\n"+extraHint : ""}\n\nSearch the web now and return the JSON described in the system prompt.`;
  const text = await callClaude(system, user, 1000, `place:${name}`);
  const parsed = extractJSON(text);
  safeDebug("[Waypoint search] place search parsed", {query:name, found: parsed && parsed.found, pricingVerified: parsed && parsed.pricingVerified, itemCount: parsed && parsed.items ? parsed.items.length : 0});
  return parsed;
}

async function aiSearchPlace(name, type, city, region, island, countryName, currency){
  let res = await aiSearchPlaceOnce(name, type, city, region, island, countryName, currency);
  // Source fallback (per spec #26): if the place was found but no price was verified on the first pass,
  // make one more attempt with a pricing-focused hint before giving up.
  if(res && res.found && !res.pricingVerified){
    const retry = await aiSearchPlaceOnce(name, type, city, region, island, countryName, currency,
      `Your first search found the place but no verified price. Search again specifically for ticket prices, a menu, or admission/pricing information for "${name}" (try queries like "${name} tickets", "${name} prices", "${name} menu"). Only report items you can now verify.`);
    if(retry && retry.pricingVerified) res = retry;
  }
  return res;
}

async function aiSearchCandidates(query, countryName, region, island, city, typeHint){
  const system = `You are a travel-search assistant. The user typed a loose, possibly partial or multi-word search query (fragments, word-order variations, abbreviations, or a well-known alias are all fine — the user does NOT need to know the exact official name). Use web search to find real candidate matches: real named places (restaurants, museums, attractions, theme parks, events, etc.) OR real destination areas/islands within the given country. Tokenize the query into its important terms and match against official names, alternate/local/common names, and known aliases — rank the best, most relevant matches first (exact name match > alias match > multi-word match > partial match > category match). Do not invent places. Respond with ONLY one JSON object, no markdown fences, no commentary:
{
 "results": [
   {"name": string, "type": string ("Island"/"Area/Destination" for a geographic area, otherwise the place type e.g. "Museum","Restaurant"),
    "island": string|null, "region": string|null, "city": string|null, "address": string|null,
    "isArea": boolean (true if this result is itself an island/district/destination area rather than a specific priced place)}
 ]
}
Return at most 8 results, best matches first. If the query provided a city/area/island/region, prefer results located there, but do not exclude good matches elsewhere in the country just because location fields were left blank.`;
  const user = `Country: ${countryName}\nRegion (optional): ${region||"(none given)"}\nIsland/Area (optional): ${island||"(none given)"}\nCity/Area (optional): ${city||"(none given)"}\nType hint (optional): ${typeHint||"(none — search broadly)"}\nSearch query: "${query}"\nToday's date: ${fmtDate(TODAY)}\n\nSearch the web now and return the ranked JSON candidate list described in the system prompt.`;
  const text = await callClaude(system, user, 800, `candidates:${query}`);
  const parsed = extractJSON(text);
  safeDebug("[Waypoint search] candidate search parsed", {query, resultCount: parsed && parsed.results ? parsed.results.length : 0});
  return parsed;
}

async function aiGetRate(fromCcy, toCcy){
  const key = fromCcy+"_"+toCcy;
  if(fromCcy===toCcy) return {rate:1, date: fmtDate(TODAY), sourceName:"Same currency", sourceUrl:""};
  if(state.rateCache[key]) return state.rateCache[key];
  const system = `Use web search to find the current real market exchange rate between two ISO 4217 currency codes. Prefer the European Central Bank reference rate when either currency is EUR-relevant or ECB publishes it; otherwise use another authoritative financial source (e.g. a major central bank or a reputable financial data provider). Respond with ONLY one JSON object, no commentary, no markdown fences:
{"rate": number, "date": "YYYY-MM-DD", "sourceName": string, "sourceUrl": string}
"rate" must mean: 1 unit of FROM = rate units of TO. Do not guess — only report a rate you found via search this turn.`;
  const user = `FROM currency: ${fromCcy}\nTO currency: ${toCcy}\nToday's date: ${fmtDate(TODAY)}`;
  const text = await callClaude(system, user, 500, `rate:${fromCcy}->${toCcy}`);
  const j = extractJSON(text);
  if(j && typeof j.rate === "number"){
    state.rateCache[key] = j;
    return j;
  }
  return null;
}

/* ============================= CALC HELPERS ============================= */
function itemSubtotal(item){
  const q = item.qty||1;
  if(item.priceType==="range"){
    return { min: (item.minPrice||0)*q, max: (item.maxPrice||0)*q, isRange:true };
  }
  return { min: (item.price||0)*q, max:(item.price||0)*q, isRange:false };
}
function placeTotals(place){
  let min=0,max=0,hasRange=false, byCat={};
  place.items.forEach(it=>{
    const s = itemSubtotal(it);
    min+=s.min; max+=s.max; if(s.isRange) hasRange=true;
    byCat[it.category] = byCat[it.category] || {min:0,max:0};
    byCat[it.category].min += s.min; byCat[it.category].max += s.max;
  });
  return {min,max,hasRange,byCat};
}
function countryTotals(country){
  let min=0,max=0,hasRange=false, byCat={};
  country.places.forEach(p=>{
    const t = placeTotals(p);
    min+=t.min; max+=t.max; if(t.hasRange) hasRange=true;
    Object.keys(t.byCat).forEach(cat=>{
      byCat[cat] = byCat[cat]||{min:0,max:0};
      byCat[cat].min += t.byCat[cat].min; byCat[cat].max += t.byCat[cat].max;
    });
  });
  return {min,max,hasRange,byCat};
}
function allItemsFlat(){
  const out=[];
  state.countries.forEach(c=>c.places.forEach(p=>p.items.forEach(it=>out.push({country:c,place:p,item:it}))));
  return out;
}

/* ============================= RENDER SHELL ============================= */
function render(){
  const app = document.getElementById('app');
  app.innerHTML = `
    ${renderHeader()}
    ${renderTabs()}
    <div class="view">${renderActiveView()}</div>
  `;
  wireHeader();
  wireTabs();
  wireActiveView();
}

function renderHeader(){
  const countryOpts = COUNTRIES.map(c=>`<option value="${c.iso2}" ${state.homeCountry===c.iso2?'selected':''}>${c.name}</option>`).join('');
  const ccyOpts = CURRENCIES.map(c=>`<option value="${c.code}" ${state.homeCurrency===c.code?'selected':''}>${c.code} — ${c.name}</option>`).join('');
  return `
  <div class="header">
    <div class="brandrow">
      <div class="brand"><h1>Waypoint</h1><span class="tag">Travel Cost Calculator</span></div>
      <div class="homebar">
        <label>Home Country</label>
        <select id="homeCountrySel"><option value="">Select…</option>${countryOpts}</select>
        <label>Home Currency</label>
        <select id="homeCurrencySel"><option value="">Select…</option>${ccyOpts}</select>
      </div>
    </div>
  </div>`;
}
function wireHeader(){
  on('homeCountrySel','change', e=>{
    state.homeCountry = e.target.value || null;
    const base = COUNTRIES.find(c=>c.iso2===state.homeCountry);
    if(base && !state.homeCurrency) state.homeCurrency = base.currency;
    render();
  });
  on('homeCurrencySel','change', e=>{
    state.homeCurrency = e.target.value || null;
    render();
  });
}

function renderTabs(){
  const totalPlaces = state.countries.reduce((a,c)=>a+c.places.length,0);
  const totalItems = allItemsFlat().length;
  const tabs = [
    ['trip','Trip Setup'],
    ['destinations','Destinations & Places', totalPlaces],
    ['selections','My Selections', totalItems],
    ['money','Money Needed'],
    ['sources','Sources', totalItems]
  ];
  return `<div class="tabs">${tabs.map(t=>`
    <div class="tab ${state.activeTab===t[0]?'active':''}" data-tab="${t[0]}">${t[1]}${t[2]?`<span class="n">${t[2]}</span>`:''}</div>
  `).join('')}</div>`;
}
function wireTabs(){
  document.querySelectorAll('.tab').forEach(el=>{
    el.onclick = ()=>{ state.activeTab = el.dataset.tab; render(); };
  });
}

function renderActiveView(){
  if(!state.homeCountry || !state.homeCurrency){
    if(state.activeTab!=='trip'){
      return `<div class="empty"><h3>Set your home country & currency first</h3><p>Use the fields in the top bar, then head to the Trip Setup tab.</p></div>`;
    }
  }
  switch(state.activeTab){
    case 'trip': return renderTrip();
    case 'destinations': return renderDestinations();
    case 'selections': return renderSelections();
    case 'money': return renderMoney();
    case 'sources': return renderSources();
    default: return '';
  }
}
function wireActiveView(){
  switch(state.activeTab){
    case 'trip': wireTrip(); break;
    case 'destinations': wireDestinations(); break;
    case 'selections': wireSelections(); break;
    case 'money': wireMoney(); break;
    case 'sources': break;
  }
}

function wireTrip(){
  const input = document.getElementById('tripCountrySearch');
  const results = document.getElementById('tripCountryResults');
  input.oninput = ()=>{
    const q = input.value.trim().toLowerCase();
    if(!q){ results.style.display='none'; return; }
    const matches = COUNTRIES.filter(c=>c.name.toLowerCase().includes(q)).slice(0,12);
    results.innerHTML = matches.map(c=>`<div data-add="${c.iso2}">${c.name} <span class="mono" style="color:var(--ink-soft);font-size:11.5px;">${c.iso2} · ${c.currency}</span></div>`).join('') || '<div style="color:var(--ink-soft);">No matches</div>';
    results.style.display='block';
    results.querySelectorAll('[data-add]').forEach(el=>{
      el.onclick = ()=>{ ensureCountry(el.dataset.add); input.value=''; results.style.display='none'; render(); state.activeTab='trip'; };
    });
  };
  document.querySelectorAll('[data-rm]').forEach(el=>{
    el.onclick = ()=>{
      state.countries = state.countries.filter(c=>c.iso2!==el.dataset.rm);
      render();
    };
  });
}

function renderPlaceCard(country, place){
  const t = placeTotals(place);
  const totalStr = t.hasRange ? `${money(t.min,place.currency)} – ${money(t.max,place.currency)}` : money(t.min, place.currency);
  const stale = daysSince(place.verifiedDate) > 30;
  return `
  <div class="place-item">
    <div class="rowtop">
      <div>
        <strong>${place.name}</strong> <span class="pill" style="margin-left:6px;">${place.type}</span>
        <div class="item-meta">${[place.city,place.island,place.region,country.name].filter(Boolean).join(' · ')}</div>
        <div style="margin-top:6px;">
          ${sourcePill(place.sourceQuality)}
          ${place.sourceUrl ? `<a class="srclink" href="${place.sourceUrl}" target="_blank" rel="noopener">${place.sourceName||'Source'}</a>` : `<span class="note">${place.sourceName||'No source link'}</span>`}
          <span class="note"> · verified ${place.verifiedDate}</span>
          ${stale?`<span class="pill stale" style="margin-left:6px;">Price may have changed</span>`:''}
        </div>
      </div>
      <div style="text-align:right;">
        <div class="mono" style="font-weight:600;">${totalStr}</div>
        <button class="btn ghost sm" data-rmplace="${place.id}" style="margin-top:8px;">Remove place</button>
      </div>
    </div>
    ${place.items.length? place.items.map(it=>renderItemRow(country,place,it)).join('') : `<div class="note" style="margin-top:8px;">No priced items added yet.</div>`}
  </div>`;
}
function sourcePill(q){
  if(q==='Official') return `<span class="pill official">Official</span>`;
  if(q==='Officially Sourced' || q==='Official Tourism') return `<span class="pill tourism">Officially Sourced</span>`;
  if(q==='Manual') return `<span class="pill manual">User-supplied</span>`;
  return `<span class="pill secondary">Verified Secondary</span>`;
}
function renderItemRow(country, place, it){
  const s = itemSubtotal(it);
  const subStr = it.priceType==='range' ? `${money(s.min,it.currency)} – ${money(s.max,it.currency)}` : money(s.min,it.currency);
  const priceStr = it.priceType==='range' ? `${money(it.minPrice,it.currency)}–${money(it.maxPrice,it.currency)}` : money(it.price,it.currency);
  return `
  <div class="item-row">
    <div>
      <div>${it.name} <span class="note" style="text-transform:capitalize;">(${it.category})</span></div>
      <div class="item-meta">${priceStr} × <input type="number" min="1" class="qty-input mono" value="${it.qty}" data-qty="${place.id}|${it.id}"> = <span class="mono">${subStr}</span></div>
    </div>
    <button class="btn ghost sm" data-rmitem="${place.id}|${it.id}">Remove</button>
  </div>`;
}

function wireDestinations(){
  document.querySelectorAll('[data-country]').forEach(el=>{
    el.onclick=()=>{ uiDestCountry = el.dataset.country; render(); };
  });
  document.querySelectorAll('[data-rmplace]').forEach(el=>{
    el.onclick=()=>{
      const c = findCountry(uiDestCountry);
      c.places = c.places.filter(p=>p.id!==el.dataset.rmplace);
      render();
    };
  });
  document.querySelectorAll('[data-rmitem]').forEach(el=>{
    el.onclick=()=>{
      const [pid,iid] = el.dataset.rmitem.split('|');
      const c = findCountry(uiDestCountry);
      const p = c.places.find(x=>x.id===pid);
      p.items = p.items.filter(i=>i.id!==iid);
      render();
    };
  });
  document.querySelectorAll('[data-qty]').forEach(el=>{
    el.onchange=()=>{
      const [pid,iid] = el.dataset.qty.split('|');
      const c = findCountry(uiDestCountry);
      const p = c.places.find(x=>x.id===pid);
      const it = p.items.find(i=>i.id===iid);
      it.qty = Math.max(1, parseInt(el.value)||1);
      render();
    };
  });

  // These controls only exist once at least one country has been added (see renderDestinations'
  // empty state) — guard every lookup so a null element never throws.
  on('manualAddBtn','click', ()=>renderManualForm());
  on('searchPlaceBtn','click', ()=>runDetailedSearch());
  on('browseMatchesBtn','click', ()=>runCandidateSearch());
}

function currentDestFormValues(){
  return {
    name: document.getElementById('placeNameInput').value.trim(),
    type: document.getElementById('placeTypeInput').value,
    city: document.getElementById('cityInput').value.trim(),
    region: document.getElementById('regionInput').value.trim(),
    island: document.getElementById('islandInput').value.trim()
  };
}

let lastDetailedSearchArgs = null;
let lastCandidateSearchArgs = null;

function renderSearchUnavailableCard(retryFn){
  return `<div class="warn-banner">
    <strong>Verified search temporarily unavailable.</strong> Online verification search couldn't complete right now — this is usually temporary. You can retry, or add the place manually using a source you already have.
    <div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap;">
      <button class="btn stamp sm" id="retrySearchBtn">Retry Search</button>
      <button class="btn ghost sm" id="goManualBtn">Add Manually</button>
    </div>
  </div>`;
}
function wireUnavailableCard(retryFn, prefill){
  const retryBtn = document.getElementById('retrySearchBtn');
  const manualBtn = document.getElementById('goManualBtn');
  if(retryBtn) retryBtn.onclick = retryFn;
  if(manualBtn) manualBtn.onclick = ()=>renderManualForm(prefill);
}

async function runDetailedSearch(nameOverride, typeOverride){
  const f = currentDestFormValues();
  const name = nameOverride!==undefined ? nameOverride : f.name;
  const type = typeOverride!==undefined ? typeOverride : f.type;
  const country = findCountry(uiDestCountry);
  if(!name){ alert('Enter a place name or search terms first.'); return; }
  lastDetailedSearchArgs = {name, type, city:f.city, region:f.region, island:f.island};
  const statusEl = document.getElementById('searchStatus');
  const resultEl = document.getElementById('searchResultCard');
  document.getElementById('candidateResults').innerHTML = '';
  statusEl.innerHTML = `<div class="loading-line"><div class="spinner"></div> Searching verified sources…</div>`;
  resultEl.innerHTML = '';
  try{
    const res = await aiSearchPlace(name, type, f.city, f.region, f.island, country.name, country.currency);
    statusEl.innerHTML = '';
    if(!res){
      resultEl.innerHTML = `<div class="warn-banner"><strong>No matching verified source found.</strong> The search completed but the response couldn't be read. Try rephrasing, use "Browse matches", or add it manually.</div>`;
      return;
    }
    if(!res.found){
      resultEl.innerHTML = `<div class="warn-banner"><strong>No matching verified source found.</strong> ${res.reason||'Try broader search terms with "Browse matches", or add it manually if you already have a source.'}</div>`;
      return;
    }
    if(!res.pricingVerified || !(res.items&&res.items.length)){
      resultEl.innerHTML = `
        <div class="card" style="background:var(--paper-dim);margin-top:14px;">
          <strong>${res.place.name}</strong> <span class="pill">${res.place.type||type||'Place'}</span>
          <div class="item-meta">${[res.place.address, res.place.island||f.island, f.city, f.region].filter(Boolean).join(' · ')}</div>
          <div class="warn-banner" style="margin-top:10px;">
            <strong>Place found — price not verified.</strong> Waypoint located this real place but couldn't confirm an actual price from a traceable source. It has not been added, and no price has been invented.
          </div>
          <button class="btn ghost sm" id="goManualBtn2">Add manually with a source I have</button>
        </div>`;
      const mb = document.getElementById('goManualBtn2');
      if(mb) mb.onclick = ()=>renderManualForm({name:res.place.name, type:res.place.type||type, city:f.city, island:res.place.island||f.island});
      return;
    }
    resultEl.innerHTML = renderSearchResult(res, name, type, f.city, f.region, f.island);
    wireSearchResult(res, type, f.city, f.region, f.island);
  }catch(e){
    statusEl.innerHTML = '';
    resultEl.innerHTML = renderSearchUnavailableCard();
    wireUnavailableCard(()=>runDetailedSearch(lastDetailedSearchArgs.name, lastDetailedSearchArgs.type), {name});
    friendlySearchError(e);
  }
}

async function runCandidateSearch(){
  const f = currentDestFormValues();
  if(!f.name){ alert('Type a name or a few search words first — it can be partial, e.g. "natural history" or "comic con".'); return; }
  lastCandidateSearchArgs = f;
  const country = findCountry(uiDestCountry);
  const statusEl = document.getElementById('searchStatus');
  const candEl = document.getElementById('candidateResults');
  document.getElementById('searchResultCard').innerHTML = '';
  statusEl.innerHTML = `<div class="loading-line"><div class="spinner"></div> Searching verified sources…</div>`;
  candEl.innerHTML = '';
  try{
    const res = await aiSearchCandidates(f.name, country.name, f.region, f.island, f.city, f.type);
    statusEl.innerHTML = '';
    if(!res || !res.results || !res.results.length){
      candEl.innerHTML = `<div class="warn-banner"><strong>No matching verified source found.</strong> Nothing turned up for "${f.name}" in ${country.name}. Try different search terms, or add it manually.</div>`;
      return;
    }
    candEl.innerHTML = `
      <div class="card" style="background:var(--paper-dim);margin-top:14px;">
        <div class="note" style="margin-bottom:10px;">Matches for "${f.name}" — best matches first. Pick one to fetch verified prices, or pick an island/area to narrow your search.</div>
        ${res.results.map((r,idx)=>`
          <div class="item-row">
            <div>
              <div><strong>${r.name}</strong> <span class="pill" style="margin-left:4px;">${r.isArea? 'Island / Area' : (r.type||'Place')}</span></div>
              <div class="item-meta">${[r.city,r.island,r.region].filter(Boolean).join(' · ')}${r.address? ' · '+r.address:''}</div>
            </div>
            <button class="btn ${r.isArea?'ghost':'brass'} sm" data-cand="${idx}">${r.isArea? 'Use as island/area' : 'View verified prices'}</button>
          </div>
        `).join('')}
      </div>`;
    document.querySelectorAll('[data-cand]').forEach(el=>{
      el.onclick = ()=>{
        const r = res.results[parseInt(el.dataset.cand)];
        if(r.isArea){
          document.getElementById('islandInput').value = r.name;
          if(r.region) document.getElementById('regionInput').value = r.region;
          document.getElementById('placeNameInput').value = '';
          document.getElementById('candidateResults').innerHTML = `<div class="note" style="margin-top:10px;">Island/Area set to "${r.name}". Now type a place — e.g. "museum" or "beach taverna" — and search again.</div>`;
        } else {
          if(r.city) document.getElementById('cityInput').value = r.city;
          if(r.island) document.getElementById('islandInput').value = r.island;
          if(r.region) document.getElementById('regionInput').value = r.region;
          document.getElementById('placeNameInput').value = r.name;
          runDetailedSearch(r.name, r.type);
        }
      };
    });
  }catch(e){
    statusEl.innerHTML = '';
    candEl.innerHTML = renderSearchUnavailableCard();
    wireUnavailableCard(()=>runCandidateSearch(), {name:f.name});
    friendlySearchError(e);
  }
}

function renderSearchResult(res, fallbackName, type, city, region, island){
  const place = res.place || {name:fallbackName, type};
  return `
  <div class="card" style="background:var(--paper-dim);margin-top:14px;">
    <div class="rowtop" style="display:flex;justify-content:space-between;">
      <div>
        <strong>${place.name}</strong> <span class="pill">${place.type||type}</span>
        <div class="item-meta">${[place.address, place.island||island, city, region].filter(Boolean).join(' · ')}</div>
        <div style="margin-top:6px;">
          ${sourcePill(res.sourceQuality)}
          <a class="srclink" href="${res.sourceUrl}" target="_blank" rel="noopener">${res.sourceName||'Source'}</a>
          <span class="note"> · verified ${res.verifiedDate}</span>
        </div>
      </div>
      <button class="btn brass sm" id="addAllFoundBtn">Add all to trip</button>
    </div>
    <div style="margin-top:12px;">
      ${(res.items||[]).map((it,idx)=>`
        <div class="item-row">
          <div>
            <div>${it.name} <span class="note" style="text-transform:capitalize;">(${it.category})</span></div>
            <div class="item-meta">${it.priceType==='range' ? money(it.minPrice,it.currency)+'–'+money(it.maxPrice,it.currency) : money(it.price,it.currency)}</div>
          </div>
          <button class="btn ghost sm" data-addfound="${idx}">Add</button>
        </div>
      `).join('') || '<div class="note">No individual priced items returned.</div>'}
    </div>
  </div>`;
}
function wireSearchResult(res, type, city, region, island){
  const country = findCountry(uiDestCountry);
  function addFoundItem(idx){
    const it = res.items[idx];
    if(!it) return;
    let place = country.places.find(p=>p.name===res.place.name && p.city===city && p.island===(res.place.island||island||''));
    if(!place){
      place = {
        id: uid(), name: res.place.name, type: res.place.type||type, city, region,
        island: res.place.island || island || '',
        currency: it.currency || res.place.matchedCurrency || country.currency,
        sourceName: res.sourceName, sourceUrl: res.sourceUrl, sourceQuality: res.sourceQuality,
        verifiedDate: res.verifiedDate, items: []
      };
      country.places.push(place);
    }
    place.items.push({
      id: uid(), name: it.name, category: it.category, priceType: it.priceType,
      price: it.price, minPrice: it.minPrice, maxPrice: it.maxPrice,
      currency: it.currency || place.currency, qty: 1,
      sourceName: res.sourceName, sourceUrl: res.sourceUrl, sourceQuality: res.sourceQuality, verifiedDate: res.verifiedDate
    });
  }
  document.querySelectorAll('[data-addfound]').forEach(el=>{
    el.onclick = ()=>{ addFoundItem(parseInt(el.dataset.addfound)); render(); };
  });
  const addAll = document.getElementById('addAllFoundBtn');
  if(addAll) addAll.onclick = ()=>{ (res.items||[]).forEach((_,i)=>addFoundItem(i)); render(); };
}

let moneyResult = null; // {perCountry:[{iso2,min,max,rate,...}], grandMin, grandMax, hasRange, byCatHome, loading, error}

function renderMoney(){
  if(!allItemsFlat().length){
    return `<div class="empty"><h3>Nothing to total yet</h3><p>Add places and items first, then come back to calculate your final cost.</p></div>`;
  }
  return `
  <div class="section-title"><h2>Money Needed</h2></div>
  <div class="section-sub">Converts every country's local-currency subtotal into ${state.homeCurrency||'your home currency'} using a live, sourced exchange rate.</div>
  <button class="btn stamp" id="finalCostBtn" style="margin-bottom:20px;">FINAL COST</button>
  <div id="moneyOutput"></div>
  `;
}
function wireMoney(){
  const out = document.getElementById('moneyOutput');
  if(!out) return; // empty-state view has no Money Needed controls yet
  if(moneyResult) out.innerHTML = renderMoneyResult(moneyResult);
  on('finalCostBtn','click', async ()=>{
    if(!state.homeCurrency){ alert('Set a home currency first.'); return; }
    out.innerHTML = `<div class="loading-line"><div class="spinner"></div> Fetching current exchange rates and converting…</div>`;
    const per = [];
    let grandMin=0, grandMax=0, hasRange=false, error=null;
    const byCatHome = {};
    for(const c of state.countries){
      if(!c.places.length) continue;
      const t = countryTotals(c);
      let rateInfo;
      try{ rateInfo = await aiGetRate(c.currency, state.homeCurrency); }catch(e){ rateInfo=null; }
      if(!rateInfo){ error = `Could not fetch a verified exchange rate for ${c.currency} → ${state.homeCurrency}.`; continue; }
      const min = t.min*rateInfo.rate, max = t.max*rateInfo.rate;
      grandMin+=min; grandMax+=max; if(t.hasRange) hasRange=true;
      Object.keys(t.byCat).forEach(cat=>{
        byCatHome[cat] = byCatHome[cat]||{min:0,max:0};
        byCatHome[cat].min += t.byCat[cat].min*rateInfo.rate;
        byCatHome[cat].max += t.byCat[cat].max*rateInfo.rate;
      });
      per.push({iso2:c.iso2, name:c.name, currency:c.currency, localMin:t.min, localMax:t.max, hasRange:t.hasRange, rateInfo, homeMin:min, homeMax:max});
    }
    moneyResult = {per, grandMin, grandMax, hasRange, byCatHome, error};
    out.innerHTML = renderMoneyResult(moneyResult);
  });
}
function renderMoneyResult(r){
  const totalStr = r.hasRange ? `${money(r.grandMin,state.homeCurrency)} – ${money(r.grandMax,state.homeCurrency)}` : money(r.grandMin,state.homeCurrency);
  const catLabels = {ticket:'Tickets',food:'Food & Drinks',drink:'Food & Drinks',souvenir:'Souvenirs',merchandise:'Souvenirs / Merchandise',activity:'Activities',other:'Other Purchases'};
  const merged = {};
  Object.keys(r.byCatHome||{}).forEach(cat=>{
    const label = catLabels[cat]||'Other Purchases';
    merged[label] = merged[label]||{min:0,max:0};
    merged[label].min += r.byCatHome[cat].min; merged[label].max += r.byCatHome[cat].max;
  });
  return `
    ${r.error? `<div class="warn-banner">${r.error} That country's total is excluded until a rate can be verified — try again.</div>`:''}
    <div class="boardingpass">
      <div class="bp-punch top"></div><div class="bp-punch bot"></div>
      <div class="bp-main">
        <div class="lbl">Money Needed · ${state.homeCurrency}</div>
        <div class="${r.hasRange?'bp-range':'bp-total'}">${totalStr}</div>
        <div class="bp-sub">${r.hasRange? 'Estimated Cost Range — some selected items are priced as ranges by their sources.' : 'Exact Estimated Total — every selected item has a single verified price.'}</div>
      </div>
      <div class="bp-stub">
        <div class="lbl">Countries</div>
        <div style="font-family:'IBM Plex Mono',monospace;font-size:13px;margin-top:8px;line-height:1.9;">
          ${r.per.map(p=>`${p.name}`).join('<br>')}
        </div>
      </div>
    </div>

    <div class="cat-total-grid">
      ${Object.keys(merged).map(label=>{
        const m = merged[label];
        const str = (m.max-m.min>0.005) ? `${money(m.min,state.homeCurrency)}–${money(m.max,state.homeCurrency)}` : money(m.min,state.homeCurrency);
        return `<div class="cat-total"><div class="lbl">${label}</div><div class="amt">${str}</div></div>`;
      }).join('')}
    </div>

    <h3 style="font-size:15px;margin:24px 0 10px;">Country breakdown</h3>
    <table class="srctable">
      <tr><th>Country</th><th>Local subtotal</th><th>Rate used</th><th>In ${state.homeCurrency}</th><th>Rate source</th></tr>
      ${r.per.map(p=>`
        <tr>
          <td>${p.name}</td>
          <td class="mono">${p.hasRange? money(p.localMin,p.currency)+'–'+money(p.localMax,p.currency) : money(p.localMin,p.currency)}</td>
          <td class="mono">1 ${p.currency} = ${p.rateInfo.rate.toFixed(4)} ${state.homeCurrency}</td>
          <td class="mono">${(p.homeMax-p.homeMin>0.01)? money(p.homeMin,state.homeCurrency)+'–'+money(p.homeMax,state.homeCurrency) : money(p.homeMin,state.homeCurrency)}</td>
          <td>${p.rateInfo.sourceUrl? `<a class="srclink" href="${p.rateInfo.sourceUrl}" target="_blank" rel="noopener">${p.rateInfo.sourceName}</a>`: (p.rateInfo.sourceName||'—')}<div class="note">${p.rateInfo.date||''}</div></td>
        </tr>
      `).join('')}
    </table>
    <div class="note" style="margin-top:10px;">Estimated currency conversion — the actual rate your bank or card issuer applies may differ.</div>
  `;
}

/* ============================= TAB: SOURCES ============================= */
function renderSources(){
  const rows = allItemsFlat();
  if(!rows.length) return `<div class="empty"><h3>No sourced items yet</h3></div>`;
  return `
  <div class="section-title"><h2>Sources</h2></div>
  <div class="section-sub">Every priced item in your trip, with where it came from and when it was checked.</div>
  <table class="srctable">
    <tr><th>Item</th><th>Place</th><th>Country</th><th>Price</th><th>Quality</th><th>Source</th><th>Verified</th></tr>
    ${rows.map(({country,place,item})=>{
      const priceStr = item.priceType==='range' ? `${money(item.minPrice,item.currency)}–${money(item.maxPrice,item.currency)}` : money(item.price,item.currency);
      const stale = daysSince(item.verifiedDate) > 30;
      return `<tr>
        <td>${item.name}</td>
        <td>${place.name}</td>
        <td>${country.name}</td>
        <td class="mono">${priceStr}</td>
        <td>${sourcePill(item.sourceQuality)}</td>
        <td>${item.sourceUrl? `<a class="srclink" href="${item.sourceUrl}" target="_blank" rel="noopener">${item.sourceName||'Link'}</a>`:(item.sourceName||'—')}</td>
        <td>${item.verifiedDate}${stale?'<br><span class="pill stale">may have changed</span>':''}</td>
      </tr>`;
    }).join('')}
  </table>`;
}

render();
</script>
</body>
</html>
